name = "magic-router"
main = "site/worker.js"
compatibility_date = "2026-08-16"

[assets]
directory = "site/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

# Workers Logs + Traces for production visibility. Safe here by design:
# the worker can only ever log paths and headers — sealed data lives in
# URL fragments, which never reach the server. Traces sampled at 1%.
[observability]
enabled = true

[observability.logs]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[vars]
PREMIUM = "true"
# Hostnames the Turnstile widget may legitimately report back to siteverify
# (comma-separated). Local dev hosts go here only if you test locally.
TURNSTILE_HOSTNAMES = "magic-router.uyj4cywb9launwtippwp.workers.dev"
# Public sitekey — exposed via /api/health so the frontend can render the
# widget. Not a secret. The matching secret is a worker secret.
TURNSTILE_SITEKEY = "0x4AAAAAAE6cpDfuuACwWuk5"
# PUBLIC_HOST = "https://your-domain.example"   # for Slack links + premium URLs
# ALLOW_REDIRECTS = "true"  # premium plaintext short-redirect mode (open
                           # redirector — opt in deliberately, see docs/PREMIUM.md)

# --- Premium mode (stateful, ciphertext only) — see docs/PREMIUM.md ---
[[kv_namespaces]]
binding = "SEAL_KV"
id = "fe65d65019564ee5ae6473ca316b3603"

# Secrets (set via `wrangler secret put`, never committed):
#   TURNSTILE_SECRET  — gates POST /api/link with Cloudflare Turnstile
#   STORE_TOKEN       — bearer token letting the CLI create hosted links
#   SLACK_SIGNING_SECRET — Slack slash command

# --- Optional Slack slash command ---
# npx wrangler secret put SLACK_SIGNING_SECRET
